<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Keartipong Pakobcam - Software Developer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f1a"/><stop offset="1" stop-color="#171033"/></linearGradient>
  <linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f472b6"/><stop offset=".55" stop-color="#fb923c"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
  <clipPath id="clip"><rect width="1000" height="260" rx="22"/></clipPath>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity=".07"/></pattern>
</defs>
<style>
  .b1{animation:d1 14s ease-in-out infinite alternate}
  .b2{animation:d2 17s ease-in-out infinite alternate}
  .b3{animation:d3 12s ease-in-out infinite alternate}
  @keyframes d1{to{transform:translate(260px,40px)}}
  @keyframes d2{to{transform:translate(-300px,-30px)}}
  @keyframes d3{to{transform:translate(-160px,60px)}}
  .hi{font:700 15px 'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#6ee7b7;animation:fi 1s .1s both}
  .nm{font:800 52px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:url(#nm);letter-spacing:-1px;animation:rise 1s .3s both}
  .rl{font:500 20px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#e5e7eb;animation:rise 1s .6s both}
  .tg{font:500 16px 'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#cbd5e1;opacity:0;animation:cyc 12s infinite}
  .tg:nth-of-type(2){animation-delay:3s} .tg:nth-of-type(3){animation-delay:6s} .tg:nth-of-type(4){animation-delay:9s}
  @keyframes fi{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes cyc{0%{opacity:0;transform:translateY(8px)}5%{opacity:1;transform:none}22%{opacity:1}27%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
  .cur{animation:bl 1s steps(2) infinite} @keyframes bl{50%{opacity:0}}
</style>
<g clip-path="url(#clip)">
  <rect width="1000" height="260" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle class="b1" cx="150" cy="70" r="110" fill="#f472b6" fill-opacity=".55"/>
    <circle class="b2" cx="820" cy="190" r="130" fill="#a78bfa" fill-opacity=".5"/>
    <circle class="b3" cx="560" cy="40" r="90" fill="#fb923c" fill-opacity=".45"/>
  </g>
  <rect width="1000" height="260" fill="url(#dots)"/>
  <rect x=".75" y=".75" width="998.5" height="258.5" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="1.5"/>
</g>
<text class="hi" x="64" y="82">&gt; hello, world_</text>
<text class="nm" x="62" y="146">Keartipong Pakobcam</text>
<text class="rl" x="64" y="182">Software Developer &#183; Thailand</text>
<g>
  <text class="tg" x="64" y="222">&#9656; building full-stack web apps</text>
  <text class="tg" x="64" y="222">&#9656; exploring cloud infrastructure</text>
  <text class="tg" x="64" y="222">&#9656; learning devops + docker</text>
  <text class="tg" x="64" y="222">&#9656; tinkering with ai</text>
</g>
</svg>